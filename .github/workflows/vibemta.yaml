# VibeMTA: builds the branded client (Windows) and the matching servers (Windows x64, Linux x64),
# then publishes them as a GitHub release. The launcher downloads the client from the latest release.
name: VibeMTA build

on:
  push:
    branches: [vibemta]
  workflow_dispatch:

permissions:
  contents: write

env:
  BDATA: https://mirror-cdn.multitheftauto.com/bdata

jobs:
  windows:
    name: Windows (client + server x64)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache-dxfiles
        with:
          path: utils/DXFiles
          key: dxfiles-0001

      - name: Download DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Invoke-WebRequest "$env:BDATA/DXFiles.zip" -OutFile utils/DXFiles.zip
        shell: powershell

      - name: Extract DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Expand-Archive -Path utils/DXFiles.zip -DestinationPath utils/DXFiles
        shell: powershell

      - name: Install CEF
        run: utils\premake5 install_cef

      - name: Install data files
        run: utils\premake5 install_data

      - name: Fork net module (client netc)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest "$env:BDATA/fork-support/netc.dll" -OutFile Bin/MTA/netc.dll
          Copy-Item Bin/MTA/netc.dll Bin/MTA/netc_d.dll -Force
          # szerver: a "Forks Full AC" leírás szerint a sima fejlesztői 64 bites net modul kell (bdata/net_64.dll) - ezt az install_data már letöltötte
          (Get-Item Bin/server/x64/net.dll).VersionInfo | Format-List FileVersion, ProductVersion

      - name: Build win32 (client)
        run: |
          cmd /c "win-build.bat release win32" 2>&1 | Tee-Object -FilePath build-win32.log
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path build-win32.log -Pattern ' error [A-Z]+[0-9]+' -Quiet)) {
            Select-String -Path build-win32.log -Pattern ' error [A-Z]+[0-9]+|fatal error' | Select-Object -First 25 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            exit 1
          }
        shell: powershell
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Build x64 (server)
        run: |
          cmd /c "win-build.bat release x64" 2>&1 | Tee-Object -FilePath build-x64.log
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path build-x64.log -Pattern ' error [A-Z]+[0-9]+' -Quiet)) {
            Select-String -Path build-x64.log -Pattern ' error [A-Z]+[0-9]+|fatal error' | Select-Object -First 25 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            exit 1
          }
        shell: powershell
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Compose files
        run: utils\premake5 compose_files

      - name: Package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out, pkg/client, pkg/server | Out-Null
          # kliens: minden, ami nem a szerver
          Get-ChildItem InstallFiles | Where-Object { $_.Name -ne 'server' } | ForEach-Object { Copy-Item $_.FullName pkg/client -Recurse -Force }
          Copy-Item LICENSE pkg/client/LICENSE.txt
          Compress-Archive -Path pkg/client/* -DestinationPath out/VibeMTA-Kliens.zip -CompressionLevel Optimal
          # szerver (Windows, 64 bit)
          Copy-Item InstallFiles/server/* pkg/server -Recurse -Force
          Copy-Item LICENSE pkg/server/LICENSE.txt
          Compress-Archive -Path pkg/server/* -DestinationPath out/VibeMTA-Szerver-win64.zip -CompressionLevel Optimal
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  linux:
    name: Linux server x64
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/multitheftauto/mtasa-blue-build:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          set +e
          ./linux-build.sh --arch=x64 > build.log 2>&1
          rc=$?
          tail -60 build.log
          if [ $rc -ne 0 ]; then
            grep -E "error:|Error [0-9]|undefined reference|No such file" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            tail -15 build.log | while IFS= read -r l; do echo "::warning::$l"; done
          fi
          exit $rc

      - name: Data + fork net module
        shell: bash
        run: |
          set -uo pipefail
          note() { echo "::notice::$*"; echo "$*"; }
          fail() { echo "::error::$*"; exit 1; }
          if ! command -v curl >/dev/null 2>&1; then
            (apt-get update -qq && apt-get install -y -qq curl ca-certificates) >/dev/null 2>&1 || true
          fi
          get() {
            if command -v curl >/dev/null 2>&1; then curl -fsSL --retry 3 "$1" -o "$2" && return 0; fi
            if command -v wget >/dev/null 2>&1; then wget -q "$1" -O "$2" && return 0; fi
            python3 -c "import sys,urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$1" "$2" 2>/dev/null && return 0
            echo "::warning::download failed: $1"; return 1
          }
          ls -la Bin Bin/server Bin/server/x64 2>&1 | head -60
          mkdir -p Bin/server/x64 Bin/server/mods/deathmatch
          # configok (mtaserver.conf, acl.xml, ...)
          cp -n Server/mods/deathmatch/*.conf Server/mods/deathmatch/*.xml Bin/server/mods/deathmatch/ 2>/dev/null || true
          cp -n Server/mods/deathmatch/mtaserver.conf.template Bin/server/mods/deathmatch/ 2>/dev/null || true
          # szerver net modul: fork-support, különben a sima fejlesztői
          # a "Forks Full AC" leírás szerint a szerverre a sima fejlesztői 64 bites net modul kell
          if get "$BDATA/net_64.so" Bin/server/x64/net.so; then
            note "developer net_64.so installed"
          else
            fail "could not download any server net module"
          fi
          cp Bin/server/x64/net.so Bin/server/x64/net_d.so
          ls -la Bin/server Bin/server/x64

      - name: Package
        run: |
          mkdir -p out
          cp LICENSE Bin/server/LICENSE.txt
          tar -C Bin -czf out/VibeMTA-Szerver-linux64.tar.gz server
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  release:
    name: Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "VibeMTA kliens #${{ github.run_number }}" \
            --notes "Automatikus build ($GITHUB_SHA). A kliens forráskódja ebben a repóban (GPLv3)." \
            --latest
